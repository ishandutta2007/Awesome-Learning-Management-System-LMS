<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-1deg); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes particleDrift {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(15px, -15px); opacity: 0.8; }
      }

      .glow-layer-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 20% 30%; }
      .glow-layer-2 { animation: pulseGlow 10s ease-in-out infinite 2s; transform-origin: 80% 70%; }
      .floating-card-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatSlow2 8.5s ease-in-out infinite 1s; }
      .floating-card-3 { animation: floatSlow1 9s ease-in-out infinite 2s; }
      .flow-path { stroke-dasharray: 8 12; animation: dashFlow 12s linear infinite; }
      .particle { animation: particleDrift 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#techGrid)"/>

  <!-- Dynamic Glowing Orbs -->
  <circle class="glow-layer-1" cx="240" cy="110" r="280" fill="url(#glow1)"/>
  <circle class="glow-layer-2" cx="960" cy="250" r="300" fill="url(#glow2)"/>

  <!-- Animated Background Network Flow Lines -->
  <g opacity="0.35">
    <path class="flow-path" d="M 80 80 Q 250 20 400 90 T 700 80 T 1120 120" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path class="flow-path" d="M 120 280 Q 380 340 600 270 T 950 300 T 1150 240" fill="none" stroke="#a855f7" stroke-width="1.5" style="animation-direction: reverse;"/>
  </g>

  <!-- Background Floating Badges / Technology Cards (Behind text, at edges) -->
  <g class="floating-card-1" opacity="0.45">
    <!-- Top-Right Card: SCORM & LTI -->
    <rect x="950" y="35" width="180" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="972" cy="56" r="6" fill="#38bdf8"/>
    <text x="988" y="61" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SCORM / LTI 1.3</text>
  </g>

  <g class="floating-card-2" opacity="0.45">
    <!-- Bottom-Left Card: Self-Hosted -->
    <rect x="60" y="275" width="195" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="82" cy="296" r="6" fill="#a855f7"/>
    <text x="98" y="301" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Self-Hosted &amp; SaaS</text>
  </g>

  <g class="floating-card-3" opacity="0.45">
    <!-- Bottom-Right Card: MOOC Analytics -->
    <rect x="960" y="275" width="175" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="982" cy="296" r="6" fill="#34d399"/>
    <text x="998" y="301" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Learner Analytics</text>
  </g>

  <!-- Particle Dots -->
  <circle class="particle" cx="180" cy="70" r="2" fill="#38bdf8"/>
  <circle class="particle" cx="820" cy="60" r="2.5" fill="#c084fc" style="animation-delay: 2s;"/>
  <circle class="particle" cx="320" cy="310" r="2" fill="#34d399" style="animation-delay: 4s;"/>
  <circle class="particle" cx="1060" cy="180" r="2.5" fill="#f43f5e" style="animation-delay: 1.5s;"/>

  <!-- Inner Frame Border -->
  <rect x="12" y="12" width="1176" height="336" rx="12" fill="none" stroke="url(#accentBorder)" stroke-width="1.2"/>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Pill Badge -->
  <g transform="translate(600, 68)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#38bdf8">📚 THE DEFINITIVE EDTECH ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)">
    Awesome Learning Management Systems
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">
    Curated Hub of Leading SaaS Platforms &amp; Open-Source LMS Deployments
  </text>

  <!-- Micro Features / Bullet Badges -->
  <g transform="translate(600, 246)">
    <!-- Pill 1 -->
    <rect x="-370" y="-14" width="165" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="-356" cy="0" r="4" fill="#38bdf8"/>
    <text x="-344" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">🎓 Enterprise LMS</text>

    <!-- Pill 2 -->
    <rect x="-190" y="-14" width="175" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="-176" cy="0" r="4" fill="#818cf8"/>
    <text x="-164" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">⚡ Self-Hosted Open Source</text>

    <!-- Pill 3 -->
    <rect x="0" y="-14" width="175" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="0" r="4" fill="#a855f7"/>
    <text x="26" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">🔌 SCORM, xAPI &amp; LTI</text>

    <!-- Pill 4 -->
    <rect x="190" y="-14" width="180" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="204" cy="0" r="4" fill="#34d399"/>
    <text x="216" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">🤖 AI-Powered Learning</text>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(600, 298)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">
      Moodle • Open edX • Canvas • Chamilo • Docebo • TalentLMS • Frappe LMS • Kolibri
    </text>
  </g>
</svg>
